[workspace]
resolver = "3"
members = ["crates/rmon-core", "crates/rmon-cli", "apps/rmon-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
